      <circle cx="846" cy="414" r="55" fill="none" stroke="#34d399" stroke-width="28" stroke-dasharray="118 345" transform="rotate(-90 846 414)"/>
      <circle cx="846" cy="414" r="55" fill="none" stroke="#f59e0b" stroke-width="28" stroke-dasharray="74 345" stroke-dashoffset="-118" transform="rotate(-90 846 414)"/>
