    <text x="64" y="99" fill="#94a3b8" font-size="15">Conversation analytics · synthetic demonstration data</text>
    <rect x="1123" y="44" width="253" height="44" rx="22" fill="#15352f" stroke="#236052"/>
    <path d="M1150 66 l7 7 13-16" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <text x="1182" y="72" fill="#d1fae5" font-size="14">PII removed before inference</text>

    <g filter="url(#shadow)">
