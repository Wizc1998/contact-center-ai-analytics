<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Voice of Customer Intelligence dashboard</title>
  <desc id="desc">A dark executive dashboard showing conversation drivers, sentiment, risk, and privacy controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#151d36"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1440" height="780" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
