    <line x1="766" y1="602" x2="1348" y2="602" stroke="#2a3959"/>
    <g fill="#dbe4ef" font-size="13">
      <text x="766" y="631">…8391</text><text x="928" y="631">Payment</text><text x="1085" y="631">Hardship</text>
      <text x="766" y="672">…1047</text><text x="928" y="672">Vehicle title</text><text x="1085" y="672">Regulatory</text>
    </g>
    <g>
