      <rect x="222" y="502" width="430" height="24" rx="12"/><rect x="222" y="557" width="430" height="24" rx="12"/>
      <rect x="222" y="612" width="430" height="24" rx="12"/><rect x="222" y="667" width="430" height="24" rx="12"/>
