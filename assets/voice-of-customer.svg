      <rect x="392" y="137" width="306" height="124" rx="16" fill="#151f38" stroke="#283659"/>
      <rect x="720" y="137" width="306" height="124" rx="16" fill="#151f38" stroke="#283659"/>
      <rect x="1048" y="137" width="328" height="124" rx="16" fill="#151f38" stroke="#283659"/>
    </g>
    <g fill="#91a1ba" font-size="13">
